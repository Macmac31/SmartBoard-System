/* ===== SmartBoard intro splash (logo pop) ===== */
#sb-splash{position:fixed;inset:0;z-index:99999;background:#2c4430;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;transition:opacity .9s ease}
#sb-splash.fade-out{opacity:0;pointer-events:none}
#sb-splash.hidden{display:none}
#sb-p1,#sb-p2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .7s ease;pointer-events:none}
#sb-p1.show,#sb-p2.show{opacity:1}
#sb-splash img{display:block;width:clamp(170px,30vw,320px);height:auto;mix-blend-mode:lighten;margin:0}
#sb-p1 img{animation:sbPulse 2s ease-in-out infinite}
@keyframes sbPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 30px rgba(217,182,106,.3))}50%{transform:scale(1.04);filter:drop-shadow(0 0 55px rgba(217,182,106,.55))}}
#sb-logo-pop{opacity:0;transform:scale(.6)}
#sb-logo-pop.animate{animation:sbPop .75s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes sbPop{from{opacity:0;transform:scale(.6);filter:blur(12px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
#sb-line{width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,182,106,.7),transparent);margin-top:28px;transition:width 1s .4s ease}
#sb-line.show{width:clamp(120px,25vw,280px)}
#sb-tag{font:400 clamp(12px,2vw,16px)/1.4 "DM Sans",Manrope,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(240,238,231,.6);margin-top:22px;opacity:0;transform:translateY(10px);transition:opacity .6s .5s ease,transform .6s .5s ease}
#sb-tag.show{opacity:1;transform:none}
.sb-hint{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);font:400 11px/1 "DM Sans",Manrope,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(240,238,231,.35);opacity:0;transition:opacity .6s 1s ease;animation:sbBob 1.8s ease-in-out infinite}
#sb-p2.show .sb-hint{opacity:1}
@keyframes sbBob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,6px)}}

<div id="sb-splash" aria-hidden="true"><div id="sb-p1"><img src="Images/smartboard.logo.png" alt="SmartBoard"></div><div id="sb-p2"><img id="sb-logo-pop" src="Images/smartboard.logo.png" alt="SmartBoard"><div id="sb-line"></div><div id="sb-tag">Boarding house, made simple</div><div class="sb-hint">Click or scroll to continue</div></div></div>
<script>
(function(){var s=document.getElementById('sb-splash');if(!s)return;
try{if(sessionStorage.getItem('sb_splash')){s.remove();return}sessionStorage.setItem('sb_splash','1')}catch(e){}
var p1=document.getElementById('sb-p1'),p2=document.getElementById('sb-p2'),pop=document.getElementById('sb-logo-pop'),ln=document.getElementById('sb-line'),tg=document.getElementById('sb-tag'),done=false,ready=false;
document.body.style.overflow='hidden';
function end(){if(done)return;done=true;s.classList.add('fade-out');document.body.style.overflow='';['wheel','touchmove','keydown'].forEach(function(t){window.removeEventListener(t,skip)});setTimeout(function(){s.classList.add('hidden')},950)}
function skip(){if(ready)end()}
p1.classList.add('show');
setTimeout(function(){p1.classList.remove('show');p2.classList.add('show');requestAnimationFrame(function(){pop.classList.add('animate')});
setTimeout(function(){ln.classList.add('show');tg.classList.add('show')},200);
setTimeout(function(){ready=true;['wheel','touchmove','keydown'].forEach(function(t){window.addEventListener(t,skip,{passive:true})});s.addEventListener('click',end,{once:true})},800);
setTimeout(end,3600)},1800);
})();
</script>

<script>
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),
P=n=>'₱'+(+n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}),pad=n=>String(n).padStart(2,'0'),

room=i=>S.rooms.find(r=>r.id==i),ten=i=>S.tenants.find(t=>t.id==i),act=m=>S.tenants.filter(t=>active(t,m)),

<div class="card"><h3>Collections by month</h3><table>${byM.map(([m,v])=>`<tr><td>${ML(m)}<td style="width:55%"><div class="bar" style="width:${v/mx*100}%"></div><td>${P(v)}`).join('')}</table></div>
<div class="card"><h3>Utility consumption per room</h3><div class="tw"><table><tr><th>Room<th>kWh<th>Electric cost<th>m³<th>Water cost</tr>${ut.map(u=>`<tr><td>${E(u[0])}<td>${u[1]}<td>${P(u[3])}<td>${u[2]}<td>${P(u[4])}`).join('')}</table></div></div>
<div class="card"><h3>Occupancy today</h3><div class="tw"><table><tr><th>Room<th>Status<th>Tenant<th>Since</tr>${S.rooms.map(r=>{let t=S.tenants.find(x=>x.room==r.id&&!x.out);return `<tr><td>${E(r.no)}<td>${tag(t?'Occupied':'Vacant')}<td>${t?E(t.n):'-'}<td>${t?t.in:'-'}`}).join('')}</table></div></div>
<div class="card"><h3>Outstanding balances</h3><div class="tw"><table>${out.length?out.map(([t,v])=>`<tr><td>Room ${room(t.room).no}<td>${E(t.n)}<td>${P(v)}`).join(''):'<tr><td>Nothing outstanding in this period.'}</table></div></div>`},
calendar(){let ds=[...Array(14)].map((_,i)=>sd(CS,i)),td=today(),
hd='<div class="ch" style="grid-column:1"></div>'+ds.map((x,i)=>`<div class="ch${x==td?' td':''}" style="grid-column:${i+2}">${new Date(x+'T00:00').toLocaleString('en',{weekday:'short'})} ${+x.slice(8)}</div>`).join(''),
rows=S.rooms.map((r,ri)=>`<div class="cr" style="grid-row:${ri+2}">Room ${E(r.no)}</div>`+ds.map((x,i)=>`<div class="cc${x==td?' td':''}" style="grid-row:${ri+2};grid-column:${i+2}"></div>`).join('')+S.tenants.filter(t=>t.room==r.id&&t.in<=ds[13]&&(!t.out||t.out>=ds[0])).map(t=>{let a=t.in<=ds[0]?0:ds.findIndex(x=>x>=t.in),e=t.out?ds.map(x=>x<=t.out).lastIndexOf(true):13;return `<div class="cb${t.out?' o':''}" style="grid-row:${ri+2};grid-column:${a+2}/${e+3}" onclick="editT(${t.id})" title="Click to edit">${E(t.n)}<small>${t.out?'Checked out':'Checked in'}</small></div>`}).join('')).join('');
return `<div class="top"><div class="f"><button class="s" onclick="CS=sd(CS,-7);R()">← Previous 7 days</button><button class="s" onclick="CS=today();R()">Today</button><button class="s" onclick="CS=sd(CS,7);R()">Next 7 days →</button></div><b>${ML(CS.slice(0,7))}</b></div><div class="cal" style="grid-template-columns:100px repeat(14,minmax(60px,1fr))">${hd}${rows}</div><p class="mut">Each bar is a stay. Click a bar to edit that tenant. Yellow marks today.</p>`},
finance(){let e=S.exp.filter(x=>x.d.slice(0,7)==MO),inc=S.ledger.filter(x=>['rent','advance','deposit'].includes(x.t)&&x.d.slice(0,7)==MO),ti=rnd(inc.reduce((s,x)=>s+x.a,0)),te=rnd(e.reduce((s,x)=>s+x.a,0)),
rows=[...inc.map(x=>({d:x.d,n:'Payment from '+ten(x.tid).n,c:x.t,a:x.a})),...e.map(x=>({d:x.d,n:x.desc,c:x.cat,a:-x.a,id:x.id}))].sort((a,b)=>a.d.localeCompare(b.d));
return `<div class="top">${mp()}</div><div class="grid">${[['Income',P(ti)],['Expenses',P(te)],['Net',P(ti-te)]].map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}</div>
<div class="card"><h3>Add expense</h3><form class="f" onsubmit="return H('exp',event)"><label>Date<input type="date" name="d" value="${today()}" required></label><label>Category<select name="cat"><option>Maintenance</option><option>Supplies</option><option>Utilities</option><option>Salaries</option><option>Other</option></select></label><label>Description<input name="desc" required></label><label>Amount ₱<input type="number" name="a" min="0.01" step=".01" required></label><button>Add expense</button></form></div>
<div class="card"><h3>Transactions</h3><div class="tw"><table><tr><th>Date<th>Name / origin<th>Category<th>Value<th></tr>${rows.map(x=>`<tr><td>${x.d}<td>${E(x.n)}<td>${x.c}<td style="color:${x.a<0?'#c0392b':'#14803a'}"><b>${x.a<0?'-':''}${P(Math.abs(x.a))}</b><td>${x.id?`<button class="sm d" onclick="delExp(${x.id})">Remove</button>`:''}`).join('')}</table></div></div>`},
users(){return `<div class="card"><h3>Roles</h3><p class="mut"><b>Owner</b>: everything, including users and rates. <b>Staff</b>: calendar, tenants, meter readings and payments. <b>Tenant</b>: own bill and ledger only.</p><div class="tw"><table><tr><th>Name<th>Username<th>Role<th></tr>${S.users.map((u,i)=>`<tr><td>${E(u.n)}<td>${E(u.u)}<td><select onchange="setRole(${u.id},this.value)" ${u.u==U.u?'disabled':''}>${opt([['owner','Owner'],['staff','Staff'],['tenant','Tenant']],u.r)}</select><td>${u.u==U.u?'<span class="mut">You</span>':`<button class="sm d" onclick="delUser(${u.id})">Remove</button>`}`).join('')}</table></div></div>`},
settings(){let L=[['elec','Electricity (₱ per kWh)'],['water','Water (₱ per m³)'],['wifi','Wi-Fi (₱ per room per month)'],['garbage','Garbage (₱ per room per month)']],nm=Object.fromEntries(L);
return `<div class="card"><h3>Set a new rate</h3><p class="mut">A rate applies from its effective month onward. Earlier statements keep the rate that was active then.</p><form class="f" onsubmit="return H('rate',event)"><label>Rate<select name="t">${opt(L)}</select></label><label>Value ₱<input type="number" name="v" min="0" step=".01" required></label><label>Effective from<input type="month" name="e" value="${CUR}" required></label><button>Save rate</button></form></div>
<div class="card"><h3>Rate history</h3><div class="tw"><table><tr><th>Rate<th>Value<th>Effective from<th></tr>${S.rates.slice().sort((a,b)=>a.t.localeCompare(b.t)||b.e.localeCompare(a.e)).map(r=>`<tr><td>${nm[r.t]}<td>${P(r.v)}<td>${r.e}<td>${rate(r.t,CUR)==r.v&&r.e<=CUR?tag('Paid').replace('Paid','Active'):''}`).join('')}</table></div></div>`}};
function LG(t){let ad=0,dp=0,rows=S.ledger.filter(x=>x.tid==t.id).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id).map(x=>{if(x.t=='advance')ad+=x.a;if(x.t=='apply')ad-=x.a;if(x.t=='deposit')dp+=x.a;if(x.t=='refund')dp-=x.a;return `<tr><td>${x.d}<td>${x.t}<td>${E(x.note)}<td>${P(x.a)}<td>${P(ad)}<td>${P(dp)}`}).join('');
return `<div class="grid"><div class="stat"><small>Advance balance</small><b>${P(ad)}</b></div><div class="stat"><small>Deposit balance</small><b>${P(dp)}</b></div></div><div class="card"><h3>Ledger</h3><div class="tw"><table><tr><th>Date<th>Type<th>Note<th>Amount<th>Advance balance<th>Deposit balance</tr>${rows}</table></div></div>`}
function SH(tid,m){let t=ten(tid),b=bill(t,m),nr='<span class="mut">No reading yet</span>';return `<h3>Billing statement - ${ML(m)}</h3><p>${E(t.n)}, Room ${b.r.no}</p><div class="tw"><table><tr><th>Charge<th>Details<th>Amount</tr><tr><td>Room rent<td><td>${P(b.rent)}
<tr><td>Electricity<td>${b.rd?`${b.rd.pe} to ${b.rd.ce} = ${b.el} kWh × ${P(b.er)}`:nr}<td>${P(b.e)}<tr><td>Water<td>${b.rd?`${b.rd.pw} to ${b.rd.cw} = ${b.wa} m³ × ${P(b.wr)}`:nr}<td>${P(b.w)}
${b.items.map(x=>`<tr><td>${E(x[0])}<td><td>${P(x[1])}`).join('')}<tr><th>Monthly total<th><th>${P(b.total)}<tr><td>Less advance credit applied<td><td>-${P(b.credit)}<tr><td>Less payments received<td><td>-${P(b.paid)}<tr><th>Amount due<th><th>${P(b.due)}</table></div>
<p>${tag(status(t,m))} Advance balance ${P(bal(tid,'adv'))}, deposit balance ${P(bal(tid,'dep'))}</p>`}
function stmt(tid,m){let can=U.r=='owner'&&bill(ten(tid),m).due>0&&bal(tid,'adv')>0;document.body.classList.add('pm');$('#m').innerHTML=`<div class="mb"><div class="card" id="stmt">${SH(tid,m)}</div><div class="row nop"><button onclick="print()">Print</button>${can?`<button class="s" onclick="applyAdv(${tid},'${m}')">Apply advance credit</button>`:''}<button class="s" onclick="closeM()">Close</button></div></div>`}
function closeM(){$('#m').innerHTML='';document.body.classList.remove('pm')}
function applyAdv(tid,m){go(async()=>{let a=rnd(Math.min(bill(ten(tid),m).due,bal(tid,'adv')));if(a>0)await api('POST','/payments',{tid,m,a,d:today(),t:'apply'})}).then(()=>stmt(tid,m))}
function checkout(id){let dep=bal(id,'dep'),x=prompt(`Deposit held: ${P(dep)}\nAmount to deduct (damages, unpaid bills):`,'0');if(x===null)return;x=+x||0;if(x<0||x>dep)return alert('Deduction must be between 0 and the deposit held.');go(()=>api('POST','/tenants/'+id+'/checkout',{deduct:x}))}
function editRent(i){let v=prompt('New monthly rent (₱):',room(i).rent);if(v!==null&&+v>=0&&v.trim()!=='')go(()=>api('PUT','/rooms/'+i,{rent:+v}))}
function delMisc(i){go(()=>api('DELETE','/misc/'+i))}
function logout(){U=null;S=null;localStorage.removeItem('sb_user');localStorage.removeItem(TK);tab='in';R()}
function editT(id){let t=ten(id);$('#m').innerHTML=`<div class="mb"><div class="card"><h3>Edit tenant</h3><form class="col" onsubmit="return H('edit',event)"><input type="hidden" name="id" value="${id}"><label>Name<input name="n" value="${E(t.n)}" required></label><label>Phone<input name="ph" value="${E(t.ph)}"></label><label>Emergency contact<input name="em" value="${E(t.em)}"></label><label>Move-in date<input type="date" name="in" value="${t.in}" required></label><label>Room<input value="${E(room(t.room).no)}" disabled></label><p class="mut">To move a tenant to another room, check them out and check them in again.</p><div class="row"><button>Save changes</button><button type="button" class="s" onclick="closeM()">Cancel</button></div></form></div></div>`}
function delExp(i){if(confirm('Remove this expense?'))go(()=>api('DELETE','/expenses/'+i))}
function setRole(id,r){go(()=>api('PUT','/users/'+id,{role:r}))}
function delUser(id){if(confirm('Remove this account?'))go(()=>api('DELETE','/users/'+id))}
const A={
async login(d){let r=await api('POST','/login',{u:d.u,p:d.p});localStorage.setItem(TK,r.token);U=r.user;localStorage.setItem('sb_user',U.u)},
async reg(d){let r=await api('POST','/register',d);localStorage.setItem(TK,r.token);U=r.user;page='dash';localStorage.setItem('sb_user',U.u)},
checkin:d=>api('POST','/tenants',d),
room:d=>api('POST','/rooms',d),
reading:d=>api('POST','/readings',d),
misc:d=>api('POST','/misc',d),
pay:d=>api('POST','/payments',d),
async edit(d){await api('PUT','/tenants/'+d.id,d);closeM()},
exp:d=>api('POST','/expenses',d),
rate:d=>api('POST','/rates',d)};
function H(n,e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));(async()=>{try{await A[n](d);if(U)await load();R()}catch(x){alert(x.message)}})();return false}
(async()=>{if(location.hash=='#register')tab='up';if(localStorage.getItem(TK)){try{U=(await api('GET','/me')).user;await load()}catch(x){U=null;S=null;localStorage.removeItem(TK);localStorage.removeItem('sb_user')}}R()})();
</script></body></html>
